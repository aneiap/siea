  <script>

    // Variable global del correo del usuario para mirar si inició sesión un DCA o DNA.

    // Variable global para controlar los capítulos (nombres en código/id de BD)

    async function seleccionarMultiCapitulos() {
        var selectPrincipal = document.getElementById("capitulo-organizador");

        // VALIDACIÓN: Detener el flujo si está seleccionado ANEIAP NACIONAL o si el usuario es de JDN
        if (selectPrincipal.value === "nacional" || capituloUsuario === "nacional") {
            Swal.fire({
                title: '¡ACCIÓN NO PERMITIDA!',
                html: '<p>La selección múltiple no está habilitada para la gestión nacional.</p><p style="color: red; font-weight: bold; margin-top: 10px;">Disponible solo para reservas capitulares</p>',
                icon: 'warning',
                confirmButtonText: 'Aceptar',
                imageUrl: 'https://i.ibb.co/kJ6gs4J/AVATAR-VALIDACIONDATOS-removebg-preview.png',
                imageWidth: 120,
                imageHeight: 235,
                imagePosition: 'top-start'
            });
            return; 
        }

        const opcionesCapitulos = {
            "uniguajira": "UNIGUAJIRA", "unimagdalena": "UNIMAGDALENA", "usasm": "USASM",
            "unicaribe": "UNICARIBE", "uniatlantico": "UNIATLÁNTICO", "uninorte": "UNINORTE",
            "unisimon": "UNISIMÓN", "cuc": "CUC", "librequilla": "LIBREQUILLA",
            "utb": "UTB", "upbmonteria": "UPBMONTERÍA", "unicordoba": "UNICÓRDOBA",
            "ufps": "UFPS", "unalmed": "UNALMED", "udea": "UDEA", "upbmed": "UPBMED",
            "utp": "UTP", "unalma": "UNALMA", "udistrital": "UDISTRITAL", "unalbog": "UNALBOG",
            "univalle": "UNIVALLE", "icesi": "ICESI", "uao": "UAO", "usc": "USC"
        };
        
        // --- LÓGICA DE DETECCIÓN INTELIGENTE ---
        if (selectPrincipal.selectedIndex !== -1) {
            var textoVisible = selectPrincipal.options[selectPrincipal.selectedIndex].text;
            
            if (textoVisible && !textoVisible.includes("Selecciona el capítulo")) {
                // Romper por comas la selección previa de la pantalla
                var nombresArray = textoVisible.split(",").map(item => item.trim()).filter(item => item !== "");
                
                // Reconstruir el array global emparejando con las claves internas de la BD
                arrayCapitulosSeleccionados = nombresArray.map(nombre => {
                    return Object.keys(opcionesCapitulos).find(key => opcionesCapitulos[key] === nombre);
                }).filter(key => key !== undefined);
            }
        }

        // Estructurar el contenedor HTML para los 5 selectores del SweetAlert2
        let formHtml = `<div style="text-align: left;">`;
        
        for (let i = 1; i <= 5; i++) {
            let valorPrecargado = arrayCapitulosSeleccionados[i - 1] || "";
            
            // El primer select siempre se muestra; los siguientes se habilitan si tienen data o si el anterior ya fue llenado
            let debeMostrar = (i === 1 || valorPrecargado !== "" || (arrayCapitulosSeleccionados[i - 2] !== undefined));

            let opcionesHtml = `<option value="" disabled ${valorPrecargado === "" ? "selected" : ""} hidden>Selecciona un capítulo</option>`;
            for (const [key, value] of Object.entries(opcionesCapitulos)) {
                opcionesHtml += `<option value="${key}" ${valorPrecargado === key ? "selected" : ""}>${value}</option>`;
            }

            formHtml += `
                <label style="font-size:14px; margin-top:10px; display:${debeMostrar ? 'block' : 'none'}" id="lbl-cap${i}"><b>Capítulo ${i}:</b></label>
                <select id="sel-cap${i}" class="swal2-input" style="width: 100%; margin-top:5px; display:${debeMostrar ? 'block' : 'none'}" onchange="mostrarSiguienteSelector(${i})">
                    ${opcionesHtml}
                </select>
            `;
        }
        formHtml += `</div>`;

        // Desplegar el modal interactivo
        const { value: formValues } = await Swal.fire({
            title: 'SELECCIONA TUS CAPÍTULOS (MÁX. 5) 🦉',
            html: formHtml,
            focusConfirm: false,
            showCancelButton: true,
            confirmButtonText: 'Guardar Selección',
            cancelButtonText: 'Cancelar',
            preConfirm: () => {
                let seleccionados = [];
                for (let i = 1; i <= 5; i++) {
                    let val = document.getElementById(`sel-cap${i}`).value;
                    // Filtrar selecciones vacías y evitar duplicados en el envío
                    if (val && !seleccionados.includes(val)) {
                        seleccionados.push(val);
                    }
                }
                if (seleccionados.length === 0) {
                    Swal.showValidationMessage('Debes seleccionar al menos un (1) capítulo.');
                    return false;
                }
                return seleccionados;
            }
        });

        // Procesar la confirmación del usuario
        if (formValues) {
            arrayCapitulosSeleccionados = formValues;
            
            // Unificar los nombres en formato visible usando comas para el menú principal
            const nombresVisibles = formValues.map(key => opcionesCapitulos[key]).join(", ");
            
            // Buscar o instanciar la opción virtual "multi" en el select de la interfaz
            var opcionMulti = selectPrincipal.querySelector('option[value="multi"]');
            if (!opcionMulti) {
                opcionMulti = document.createElement("option");
                opcionMulti.value = "multi";
                selectPrincipal.appendChild(opcionMulti);
            }
            
            opcionMulti.text = nombresVisibles;
            selectPrincipal.value = "multi";
        }
    }

    function mostrarSiguienteSelector(index) {
        if (index < 5) {
            const siguienteSelect = document.getElementById(`sel-cap${index + 1}`);
            const siguienteLbl = document.getElementById(`lbl-cap${index + 1}`);
            if (siguienteSelect && siguienteSelect.style.display === "none") {
                siguienteSelect.style.display = "block";
                siguienteLbl.style.display = "block";
            }
        }
    }

    // Función auxiliar para ir mostrando el siguiente desplegable automáticamente dentro del Swal
    function mostrarSiguienteSelector(index) {
        if (index < 5) {
            const siguienteSelect = document.getElementById(`sel-cap${index + 1}`);
            const siguienteLbl = document.getElementById(`lbl-cap${index + 1}`);
            if (siguienteSelect && siguienteSelect.style.display === "none") {
                siguienteSelect.style.display = "block";
                siguienteLbl.style.display = "block";
            }
        }
    }

    // Esta función se ejecuta cada vez que el usuario usa el select tradicional
    function actualizarCapituloUnico() {
        var select = document.getElementById("capitulo-organizador");
        var valorSeleccionado = select.value;
        
        // Si el usuario elige un capítulo normal, reiniciamos el array y guardamos solo ese
        if (valorSeleccionado) {
            arrayCapitulosSeleccionados = [valorSeleccionado];
        }
    }

function controlarCamposPublicidad() {
    var seleccion = document.getElementById("publicidad-comite").value;
    var contenedorObs = document.getElementById("contenedor-observaciones-publicidad");
    var contenedorFoto = document.getElementById("contenedor-foto-ponente");
    
    var inputObs = document.getElementById("observaciones-publicidad");
    var inputFoto = document.getElementById("foto-ponente");

    if (seleccion === "si") {
        // Mostrar campos con animación fluida de bloque de cuadrícula
        if (contenedorObs) contenedorObs.style.display = "block";
        if (contenedorFoto) contenedorFoto.style.display = "block";
    } else {
        // Ocultar campos de inmediato
        if (contenedorObs) contenedorObs.style.display = "none";
        if (contenedorFoto) contenedorFoto.style.display = "none";
        
        // Buenas prácticas UX: Limpiar los campos ocultos para que no viajen strings accidentales a Firebase
        if (inputObs) inputObs.value = "";
        if (inputFoto) inputFoto.value = "";
    }
}

// Asegurar que la lógica se evalúe inmediatamente al renderizar la página por primera vez
window.addEventListener('DOMContentLoaded', function() {
    controlarCamposPublicidad();
});

    // Esta función permite cambiar la visibilidad de los campos "ubicación/plataforma" y "lugar presencial"
    // en la sección "REGISTRAR RESERVA (AC1)" según la modalidad seleccionada.
    function toggleUbicacionPlataforma() {
      // Obtenemos los elementos HTML correspondientes a los contenedores de ubicación/plataforma y lugar presencial.
      var ubicacionPlataformaContainer = document.getElementById("ubicacion-plataforma-container");
      var lugarPresencialContainer = document.getElementById("lugar-presencial-container");
      
      // Obtenemos el valor seleccionado en el campo "modalidad-evento".
      var modalidadEvento = document.getElementById("modalidad-evento").value;

      // Comparamos el valor seleccionado con las opciones.
      if (modalidadEvento === "virtual") {
        // Si la modalidad es "virtual", mostramos el campo "ubicación/plataforma" y ocultamos "lugar presencial".
        ubicacionPlataformaContainer.style.display = "block";
        lugarPresencialContainer.style.display = "none";
      } else if (modalidadEvento === "presencial") {
        // Si la modalidad es "presencial", mostramos "lugar presencial" y ocultamos "ubicación/plataforma".
        ubicacionPlataformaContainer.style.display = "none";
        lugarPresencialContainer.style.display = "block";
      } else {
        // En caso contrario, ocultamos ambos campos.
        ubicacionPlataformaContainer.style.display = "none";
        lugarPresencialContainer.style.display = "none";
      }
    }

    function verificarDisponibilidadRegistro() {
    return new Promise((resolve, reject) => {
        var nuevaFecha = document.getElementById("fecha-evento").value;
        var nuevaHora = Number(document.getElementById("hora-evento").value);
        var nuevaDuracion = Number(document.getElementById("duracion-evento").value);

        // Validación de hora límite (22:00)
        if (nuevaDuracion + nuevaHora > 1321) {
        Swal.fire({
            title: '¡ESTÁS INTENTANDO RESERVAR DESPUÉS DE LAS 22:00 (10PM)!',
            text: 'El evento debe estar programado para finalizar a más tardar hasta las 22:00, ve a la duración del mismo y edítala de tal forma que no se excedan las 22:00 (10pm)',
            icon: 'warning',
            confirmButtonText: 'Aceptar',
            imageUrl: 'https://i.ibb.co/kJ6gs4J/AVATAR-VALIDACIONDATOS-removebg-preview.png',
            imageWidth: 120,
            imageHeight: 235,
            imagePosition: 'top-start'
        });
        resolve(false);
        return;
        }

        // Asegurar que haya al menos un capítulo seleccionado
        if (arrayCapitulosSeleccionados.length === 0) {
        var selectPrincipal = document.getElementById("capitulo-organizador");
        if (selectPrincipal.value && selectPrincipal.value !== "multi") {
            arrayCapitulosSeleccionados = [selectPrincipal.value];
        } else {
            Swal.fire({
            title: '¡FALTAN CAMPOS!',
            text: 'Por favor, selecciona al menos un capítulo antes de continuar.',
            icon: 'warning',
            confirmButtonText: 'Aceptar'
            });
            resolve(false);
            return;
        }
        }

        var reservasRef = firebase.firestore().collection("reservas");
        
        // Mapeamos cada capítulo seleccionado a una Promesa de consulta individual
        let consultasPromesas = arrayCapitulosSeleccionados.map(capituloIndividual => {
        let consulta = reservasRef.where("fechaEvento", "==", nuevaFecha).where("capitulo", "in", [capituloIndividual, "nacional"]);
        
        return consulta.get().then(function(querySnapshot) {
            var disponibilidadHorarios = Array(28).fill(true);

            querySnapshot.forEach(function(doc) {
            var data = doc.data();

            // Ignorar escuela-directores nacional
            if (data && data.capitulo === "nacional" && data.tipoEvento === "escuela-directores") {
                return;
            }

            var horaEvento = Number(data.horaEvento);
            var duracionEvento = Number(data.duracionEvento);
            
            var inicioIntervalo = Math.max(0, Math.floor((horaEvento - 480) / 30));
            var finIntervalo = Math.min(28, inicioIntervalo + Math.floor(duracionEvento / 30));

            for (var i = inicioIntervalo; i < finIntervalo; i++) {
                disponibilidadHorarios[i] = false;
            }
            });

            // Calcular índices del nuevo intervalo deseado
            var inicioNuevoIntervalo = Math.max(0, Math.floor((nuevaHora - 480) / 30));
            var finNuevoIntervalo = Math.min(28, inicioNuevoIntervalo + Math.floor(nuevaDuracion / 30));

            // Evaluar paquetes de horarios para este capítulo específico
            var disponibilidadMatutino = true;
            var disponibilidadVesperino = true;
            var disponibilidadNocturno = true;

            for (var i = 0; i <= 9; i++) { if (!disponibilidadHorarios[i]) { disponibilidadMatutino = false; break; } }
            for (var i = 10; i <= 19; i++) { if (!disponibilidadHorarios[i]) { disponibilidadVesperino = false; break; } }
            for (var i = 20; i <= 27; i++) { if (!disponibilidadHorarios[i]) { disponibilidadNocturno = false; break; } }

            // Verificar si el espacio solicitado está pisado
            var algunIntervaloOcupado = false;
            for (var k = inicioNuevoIntervalo; k < finNuevoIntervalo; k++) {
            if (!disponibilidadHorarios[k]) {
                algunIntervaloOcupado = true;
                break;
            }
            }

            if (algunIntervaloOcupado) {
            let nombreCapMayuscula = capituloIndividual.toUpperCase();
            
            if (!disponibilidadMatutino && !disponibilidadVesperino && !disponibilidadNocturno) {
                return { disponible: false, msg: `¡SIN DISPONIBILIDAD EN TODO EL DÍA! Ya no es posible reservar en ningún espacio del día debido a que los 3 horarios están ocupados para el capítulo ${nombreCapMayuscula}.`, img: 'https://i.ibb.co/LPTDqcy/AVATAR-NODISPOTODODIA-removebg-preview.png', title: `¡SIN DISPONIBILIDAD EN TODO EL DÍA! 📅` };
            }
            if (!disponibilidadMatutino && inicioNuevoIntervalo <= 9) {
                return { disponible: false, msg: `No hay disponibilidad en el horario matutino para el capítulo ${nombreCapMayuscula}. Prueba cambiar el día, hora o duración.`, img: 'https://i.ibb.co/4p0C8SC/AVATAR-HORARIOSNODISPO-removebg-preview.png', title: `¡SIN DISPONIBILIDAD EN EL HORARIO MATUTINO! 🌤️` };
            }
            if (!disponibilidadVesperino && inicioNuevoIntervalo <= 19) {
                return { disponible: false, msg: `No hay disponibilidad en el horario vespertino para el capítulo ${nombreCapMayuscula}. Prueba cambiar el día, hora o duración.`, img: 'https://i.ibb.co/4p0C8SC/AVATAR-HORARIOSNODISPO-removebg-preview.png', title: `¡SIN DISPONIBILIDAD EN EL HORARIO VESPERTINO! ☀️` };
            }
            if (!disponibilidadNocturno) {
                return { disponible: false, msg: `No hay disponibilidad en el horario nocturno para el capítulo ${nombreCapMayuscula}. Prueba cambiar el día, hora o duración.`, img: 'https://i.ibb.co/4p0C8SC/AVATAR-HORARIOSNODISPO-removebg-preview.png', title: `¡SIN DISPONIBILIDAD EN EL HORARIO NOCTURNO! 🌕` };
            }
            }

            return { disponible: true };
        });
        });

        // Resolver todas las consultas en paralelo
        Promise.all(consultasPromesas).then(function(resultados) {
        // Buscamos si algún resultado arrojó falta de disponibilidad
        var conflicto = resultados.find(r => r.disponible === false);

        if (conflicto) {
            Swal.fire({
            title: conflicto.title,
            text: conflicto.msg,
            icon: 'error',
            confirmButtonText: 'Aceptar',
            allowOutsideClick: true,
            backdrop: true,
            allowEscapeKey: true,
            imageUrl: conflicto.img,
            imageWidth: 120,
            imageHeight: 235,
            imagePosition: 'top-start'
            });
            resolve(false); // Detiene el registro
        } else {
            resolve(true); // Todos los capítulos tienen disponibilidad
        }
        }).catch(function(error) {
        console.error("Error al verificar la disponibilidad en cascada:", error);
        resolve(false);
        });
    });
    }

    // Acá está la función para agregar un evento en la colección "reservas" y documento "basededatos",
    // también tiene en cuenta la posibilidad de adjuntar imagen del ponente y reiniciará los campos cuando se registren.

    const db = firebase.firestore().collection("reservas").doc(claveEvento);

    // 1. Definir el capítulo raíz como un String (tomamos la primera posición del array global o el valor convencional)
    let capituloRaizString = "";
    if (capituloUsuario === "nacional" || capitulo === "nacional") {
        capituloRaizString = "nacional";
    } else {
        capituloRaizString = arrayCapitulosSeleccionados[0] || capitulo;

    // 2. Definir el array de capítulos organizadores completo
    let arrayFinalCapitulos = [];

        arrayFinalCapitulos = ["nacional"];

        arrayFinalCapitulos = [...arrayCapitulosSeleccionados];

        horaEvento: horaEvento,

        modalidadEvento: modalidadEvento,

// Esta función genera una clave de evento aleatoria.
    // La clave tiene siempre una cantidad total de 15 caracteres (letras mayúsculas y dígitos) de forma aleatoria.
    function generarClaveEvento() {
      // Definimos una cadena de caracteres que contendrá letras mayúsculas y dígitos.
      var caracteres = "ABCDEFGHIJKLMNOPQRSTUVWXYZ01234567890123456789";
      
      // Especificamos la longitud deseada para la clave generada.
      var longitud = 15;
      
      // Inicializamos una variable para almacenar la clave generada.
      var claveGenerada = "";

      // Iniciamos un bucle para generar cada carácter de la clave.
      for (var i = 0; i < longitud; i++) {
        // Generamos un número aleatorio entre 0 (inclusive) y la longitud de la cadena de caracteres.
        var indiceAleatorio = Math.floor(Math.random() * caracteres.length);
        
        // Agregamos el carácter correspondiente al índice aleatorio a la clave generada.
        claveGenerada += caracteres.charAt(indiceAleatorio);
      }

      // Devolvemos la clave generada como resultado.
      return claveGenerada;
    }

    // Esta función verifica si hacen falta campos obligatorios en la sección "REGISTRAR RESERVA" y en caso de hacer

    function validarCamposRegistrarReserva() {
      // Obtener los valores de los campos
      var nombreEvento = document.getElementById("nombre-evento").value;

      var publicidadComite = document.getElementById("publicidad-comite").value.toLowerCase();
      var fotoPonente = document.getElementById("foto-ponente").value;

      // Lista para almacenar los campos faltantes
      var camposFaltantes = [];

      // Verificar qué campos están vacíos y agregar sus nombres a la lista
      if (nombreEvento.trim() === "") {
        camposFaltantes.push("Nombre del evento");
      }
      if (fechaEvento.trim() === "") {
        camposFaltantes.push("Fecha del evento");
      }
      if (horaEvento.trim() === "") {
        camposFaltantes.push("Hora del evento");
      }
      if (duracionEvento.trim() === "") {
        camposFaltantes.push("Duración del evento");
      }
      if (modalidadEvento.trim() === "") {
        camposFaltantes.push("Modalidad del evento");
      }
      if (ubicacionPlataforma.trim() === "" && lugarPresencial.trim() === "") {
            camposFaltantes.push("Ubicación en plataforma o Lugar presencial");
        }
      if (planEvento.trim() === "") {
        camposFaltantes.push("Plan del evento");
      }
      if (nombreOrganizador.trim() === "") {
        camposFaltantes.push("Nombre del organizador");
      }
      if (emailOrganizador.trim() === "") {
        camposFaltantes.push("Email del organizador");
      }
      if (capitulo.trim() === "") {
        camposFaltantes.push("Capítulo");
      }
      if (telefonoOrganizador.trim() === "") {
        camposFaltantes.push("Teléfono del organizador");
      }
      if (nombrePonente.trim() === "") {
        camposFaltantes.push("Nombre del ponente");
      }
      if (publicidadComite === "") {
          camposFaltantes.push("Publicidad SÍ/NO");
      }   
      if (publicidadComite === "si" && fotoPonente.trim() === "") {
        camposFaltantes.push("Foto del ponente");
      }

      // Mostrar la alerta si hay campos faltantes con la concatenación de los campos faltantes.
      if (camposFaltantes.length > 0) {
        var mensaje = "Faltan campos por diligenciar:\n";
        for (var i = 0; i < camposFaltantes.length; i++) {
          mensaje += "- " + camposFaltantes[i] + "\n";
        }

        Swal.fire({
          title: '¡FALTAN CAMPOS POR DILIGENCIAR EN TU RESERVA!',
          text: mensaje,
          icon: 'warning',
          confirmButtonText: 'Aceptar',
          allowOutsideClick: true,
          backdrop: true,  
          allowEscapeKey: true,
          imageUrl: 'https://i.ibb.co/CBcrYmF/AVATAR-FALTANCAMPOS-removebg-preview.png', // URL de la imagen
          imageWidth: 120, // Ancho de la imagen en píxeles
          imageHeight: 235, // Alto de la imagen en píxeles
          imagePosition: 'top-start' // Posición de la imagen ('top-start', 'top', 'top-end', 'center', 'center-start', 'center-end', 'bottom-start', 'bottom', 'bottom-end')
        });
        return false;
      }

      return true; // Todos los campos están llenos
    }

        // Obtener el texto de los capítulos para la plantilla de publicidad
        var selectElement = document.getElementById("capitulo-organizador");

        const fotoPonenteURL = document.getElementById("foto-ponente").value.trim();
        const fotoPonenteTexto = fotoPonenteURL ? "Link de la foto del ponente: " : "";
        console.log("Foto Ponente URL:", fotoPonenteURL);

        // Parámetros para la plantilla de solicitud de publicidad
        const params = {
            tituloCorreo: "Solicitud de Publicidad para el Evento",
            saludoInicial: "Estimado Comité de Piezas Publicitarias",
            mensajeIntroduccion: "Solicitamos la realización de publicidad para el siguiente evento:",
            claveEventoReserva: "***********" + claveReservaCreada.slice(-4),
            fechaReserva: document.getElementById("fecha-evento").value || "",
            horaReserva: `${Math.floor(document.getElementById("hora-evento").value / 60)
                .toString().padStart(2, "00")}:${(document.getElementById("hora-evento").value % 60)
                .toString().padStart(2, "00")}` || "",
            duracionEvento: `${Math.floor(document.getElementById("duracion-evento").value / 60)} hora(s) ${document.getElementById("duracion-evento").value % 60} minuto(s)`,
            planEvento: document.getElementById("plan-evento").value || "",
            observacionesReserva: document.getElementById("observaciones-evento").value || "No se especificaron observaciones.",
            capitulo: textoCapitulosVisual || "",
            modalidadReserva: modalidad || "",
            ubicacionOPlataforma: ubicacionOPlataforma,
            nombrePonente: document.getElementById("nombre-ponente").value || "",
            mensajePublicidad: "El organizador ha solicitado la realización de la publicidad para el evento.",
            observacionesPublicidad: document.getElementById("observaciones-publicidad").value ? `Observaciones de la publicidad: ${document.getElementById("observaciones-publicidad").value}` : "No se especificaron observaciones.",
            fotoPonenteTexto: fotoPonenteTexto,
            fotoPonenteURL: fotoPonenteURL,
            mensajeFinal: "Por favor, revise esta solicitud y proporcione detalles sobre la publicidad requerida.",
            despedida: "Atentamente, organizadores del espacio.",
            to_email: correoDestino,
            subject: subject
        };

        console.log("Params enviados a emailjs PUBLICIDAD:", params);

        emailjs.send("siea_6zoabdr", "registro_reservas", params)
            .then((response) => {
                console.log("Correo de solicitud de publicidad enviado exitosamente", response.status, response.text);
                alert("Solicitud de publicidad enviada exitosamente.");
            })
            .catch((error) => {
                console.error("Error al enviar la solicitud de publicidad:", error);
                alert(`Error al enviar la solicitud de publicidad: ${error.text || "Error desconocido"}. Por favor, consulta al administrador.`);
            });
    }

    function iniciarSesionJDN() {
        Swal.fire({
            title: 'Validación requerida',
            text: 'Ingresa la contraseña para la cuenta jdn@aneiap.co y poder reservar a nivel nacional.',
            input: 'password',
            inputLabel: 'Contraseña de JDN',
            inputPlaceholder: 'Ingresa la contraseña',
            inputAttributes: {
                maxlength: 20,
                autocapitalize: 'off',
                autocorrect: 'off'
            },
            showCancelButton: false,
            confirmButtonText: 'Validar',
            showLoaderOnConfirm: true,
            preConfirm: (password) => {
                return firebase.firestore().collection("cuentas").doc("jdn@aneiap.co").get()
                    .then(doc => {
                        if (!doc.exists) {
                            throw new Error('No se encontró la cuenta');
                        }
                        if (doc.data().pass !== password) {
                            Swal.showValidationMessage('La contraseña es incorrecta.');
                            return false; // Retornar false para que no se cierre el Swal
                        }
                        return true; // Retornar true para cerrar el Swal
                    })
                    .catch(error => {
                        Swal.showValidationMessage(`Error: ${error}`);
                        return false; // Retornar false para que no se cierre el Swal
                    });
            },
            allowOutsideClick: () => !Swal.isLoading()
        }).then((result) => {
            if (result.isConfirmed) {
                // Si la validación es exitosa
                Swal.fire({
                    title: 'Inicio de sesión exitoso',
                    text: '¡Has iniciado sesión correctamente!',
                    icon: 'success',
                    confirmButtonText: 'Aceptar'
                });
                // Asignar valores a las variables globales
                correoUsuario = "jdn@aneiap.co";
                capituloUsuario = "nacional";
            }
        });
    }

  </script>
